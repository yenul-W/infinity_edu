<body class="sociotype">

  <header class="topic-header">

      <div class="header-nav">
        <a href="../../index.html" class="back-link">&larr; All Topics</a>
        <div class="header-actions">

        </div>
      </div>

  </header>

  <main class="main-content">
    <div class="pdf-viewer-container">
      <div class="lessons-sidebar" id="lessonsList"></div>
      <div class="pdf-viewer-main">
        <div class="pdf-controls">
          <div class="control-group" id="fileControls">
            <button class="pdf-btn" id="downloadBtn">&#8595; Download</button>
            <a class="pdf-btn" id="openExternalBtn" href="#" target="_blank" rel="noreferrer">&#8599; Open</a>
            <button class="pdf-btn" id="printSyllabusBtn">&#8942; Print Syllabus</button>
          </div>
          <div class="control-group" id="pageControls">
            <button class="pdf-nav-arrow" id="prevPage" disabled>&#8592;</button>
            <input class="page-info" id="pageInfo" type="text" inputmode="numeric" placeholder="–" disabled><span class="page-sep" id="pageTotal">/ –</span>
            <button class="pdf-nav-arrow" id="nextPage" disabled>&#8594;</button>
          </div>
          <div class="control-group" id="zoomControls">

            <div class="pdf-loading-spinner"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="../../pdf-viewer.js"></script>
  <script>
    const toggle = document.getElementById('darkModeToggle');
    const toggleIcon = toggle.querySelector('.toggle-icon');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    if (isDark) { html.classList.add('dark-mode'); toggleIcon.textContent = 'light'; }
    else { html.classList.remove('dark-mode'); toggleIcon.textContent = 'dark'; }
    toggle.addEventListener('click', () => {
      const nowDark = html.classList.toggle('dark-mode');
      localStorage.setItem('theme', nowDark ? 'dark' : 'light');
      toggleIcon.textContent = nowDark ? 'light' : 'dark';
      const frame = document.getElementById('pdfHtmlFrame');
      try { if (frame && frame.contentDocument && frame.contentDocument.documentElement) { frame.contentDocument.documentElement.classList.toggle('dark-mode', nowDark); } } catch (e) {}
      try { if (frame && frame.contentWindow) { frame.contentWindow.postMessage({ type: 'ie-theme', dark: nowDark }, '*'); } } catch (e) {}
    });

    const TOPIC_ID = 6;

    const lessons = [
      {
        num: 1,
        title: 'Graphing Linear Functions',
        slides: 'lesson-01-graphing.html',
        annotated: null,
        kind: 'html',
        syllabus: [
          'Graph linear functions from a table of values',
          'Calculate gradient using rise/run between two points',
          'Identify and interpret positive and negative gradients',
          'Identify the y-intercept of a line from its graph'
        ]
      },
      {
        num: 2,
        title: 'Gradient-Intercept & Linear Models',
        slides: 'lesson-02-gradient-intercept.html',
        annotated: null,
        kind: 'html',
        syllabus: [
          'Determine gradient and y-intercept from y = mx + b',
          'Rearrange equations into gradient-intercept form',
          'Sketch lines using the gradient-intercept method',
          'Construct and interpret linear models in real-world contexts'
        ]
      },
      {
        num: 3,
        title: 'Direct Variation',
        slides: 'lesson-03-direct-variation.html',
        annotated: null,
        kind: 'html',
        syllabus: [
          'Identify direct variation relationships from tables and graphs',
          'Determine the constant of variation k using y = kx',
          'Solve practical direct variation problems',
          'Distinguish direct variation from other linear relationships'
        ]
      },
      {
        num: 4,
        title: 'Spreadsheet Modelling',
        slides: 'lesson-04-spreadsheet.html',
        annotated: null,
        kind: 'html',
        syllabus: [
          'Use linear models to represent real-world contexts in table and graph form',
          'Interpret gradient and y-intercept in practical situations',
          'Explore how changing a parameter affects a linear relationship',
          'Connect tabular, graphical and algebraic representations'
        ]
      },
      {
        num: 5,
        homework: true,
        slides: 'lesson-04-homework.html',
        annotated: null,
        kind: 'html',
        syllabus: []
      },
      {
        num: 6,
        title: 'Revision',
        revision: true,
        slides: 'lesson-05-revision.html',
        annotated: null,
        kind: 'html',
        syllabus: [
          'Review all Linear Relationships dot-points',
          'Mixed exam-style practice questions with worked solutions'
        ]
      }
    ];

    initPdfViewer({ topicId: TOPIC_ID, lessons });
  </script>
  <script src="../../question-popup.js"></script>
</body>
</html>
