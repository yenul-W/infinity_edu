<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment &amp; Loans &mdash; Year 12 Maths Standard 2</title>
  <link rel="stylesheet" href="../../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
</head>
<body class="sociotype">

  <header class="topic-header">
    <div class="header-inner">
      <div class="header-nav">
        <a href="../../year-12.html" class="back-link">&larr; All Topics</a>
        <div class="header-actions">
          <a class="syllabus-chip-inline" href="https://curriculum.nsw.edu.au/learning-areas/mathematics/mathematics-standard-11-12-2024/content/year-12-tba2/fac80cab35" target="_blank" rel="noreferrer noopener">Syllabus &#8599;</a>
          <button id="darkModeToggle" class="dark-mode-btn" title="Toggle dark mode"><span class="toggle-icon">dark</span></button>
        </div>
      </div>
      <h1 class="topic-page-title">Investment <em>&amp; Loans</em></h1>
    </div>
  </header>

  <main class="main-content">
    <div class="pdf-viewer-container">
      <div class="lessons-sidebar" id="lessonsList"></div>
      <div class="pdf-viewer-main">
        <div class="pdf-controls">
          <div class="control-group" id="fileControls">
            <button class="pdf-btn" id="downloadBtn">&#8595; Download</button>
            <a class="pdf-btn" id="openExternalBtn" href="#" target="_blank" rel="noreferrer">&#8599; Open</a>
            <button class="pdf-btn" id="printSyllabusBtn">&#8942; Print Syllabus</button>
          </div>
          <div class="control-group" id="pageControls">
            <button class="pdf-nav-arrow" id="prevPage" disabled>&#8592;</button>
            <input class="page-info" id="pageInfo" type="text" inputmode="numeric" placeholder="–" disabled><span class="page-sep" id="pageTotal">/ –</span>
            <button class="pdf-nav-arrow" id="nextPage" disabled>&#8594;</button>
          </div>
          <div class="control-group" id="zoomControls">
            <div class="zoom-control">
              <button class="zoom-btn" id="zoomOut">&#8722;</button>
              <span class="zoom-display" id="zoomDisplay">–</span>
              <button class="zoom-btn" id="zoomIn">+</button>
            </div>
          </div>
        </div>
        <div class="pdf-stage" id="pdfStage">
          <div class="pdf-loading" id="pdfLoading">
            <div class="pdf-loading-spinner"></div>
            <p>Loading</p>
          </div>
          <div class="pdf-canvas-wrapper" id="pdfCanvasWrapper" style="display:none"></div>
          <iframe class="pdf-html-frame" id="pdfHtmlFrame" src="about:blank" title="Lesson"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script src="../../pdf-viewer.js"></script>
  <script>
    const toggle = document.getElementById('darkModeToggle');
    const toggleIcon = toggle.querySelector('.toggle-icon');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    if (isDark) { html.classList.add('dark-mode'); toggleIcon.textContent = 'light'; }
    else { html.classList.remove('dark-mode'); toggleIcon.textContent = 'dark'; }
    toggle.addEventListener('click', () => {
      const nowDark = html.classList.toggle('dark-mode');
      localStorage.setItem('theme', nowDark ? 'dark' : 'light');
      toggleIcon.textContent = nowDark ? 'light' : 'dark';
      const frame = document.getElementById('pdfHtmlFrame');
      try { if (frame && frame.contentDocument && frame.contentDocument.documentElement) { frame.contentDocument.documentElement.classList.toggle('dark-mode', nowDark); } } catch (e) {}
      try { if (frame && frame.contentWindow) { frame.contentWindow.postMessage({ type: 'ie-theme', dark: nowDark }, '*'); } } catch (e) {}
    });

    const TOPIC_ID = 'y12-2';

    const lessons = [
      {
        num: 1,
        title: "Simple & Compound Interest",
        slides: "lesson-01-compound-interest.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Calculate simple interest using I = Prn",
          "Calculate the future value, present value or interest rate of a compound interest investment using FV = PV(1 + r)^n",
          "Examine the effect of varying the interest rate, term or compounding period on the future value",
          "Compare the growth of simple and compound interest investments numerically and graphically",
          "Recognise that simple interest graphs are linear and compound interest graphs are exponential",
          "Use a spreadsheet to model investments using both simple and compound interest"
        ]
      },
      {
        num: 2,
        title: "Depreciation, Shares & Inflation",
        slides: "lesson-02-depreciation-shares.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Apply straight-line depreciation using S = V0 - Dn",
          "Apply the declining balance method using S = V0(1 - r)^n",
          "Compare straight-line and declining balance depreciation numerically and graphically",
          "Graph and interpret the value of a share over time",
          "Calculate the dividend paid and the dividend yield on shares (excluding franked dividends)",
          "Compare and contrast savings accounts, shares and buying property as investment strategies"
        ]
      },
      {
        num: 3,
        title: "Reducing-Balance Loans & Credit Cards",
        slides: "lesson-03-loans-credit-cards.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Compare and analyse the costs associated with short term and long term loans",
          "Model a reducing balance loan as an application of compound interest with periodic repayments in tabular form",
          "Use a spreadsheet to model and solve problems involving a reducing balance loan",
          "Examine the effect of changing the repayment frequency or making additional repayments on the term and cost of a loan",
          "Solve problems involving reducing balance loans, including total amount paid, repayments, amount owing and time to repay",
          "Explain how credit cards are an example of a reducing balance loan and identify associated fees and charges"
        ]
      },
      {
        num: 4,
        homework: true,
        slides: "lesson-04-homework.html",
        annotated: null,
        kind: "html",
        syllabus: []
      },
      {
        num: 5,
        title: "Revision",
        revision: true,
        slides: "lesson-05-revision.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Review all Investment and Loans dot-points",
          "Mixed exam-style practice with full worked solutions"
        ]
      }
    ];

    initPdfViewer({ topicId: TOPIC_ID, lessons });
  </script>
  <script src="../../question-popup.js"></script>
</body>
</html>
