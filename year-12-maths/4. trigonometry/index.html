<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trigonometry &mdash; Year 12 Maths Standard 2</title>
  <link rel="stylesheet" href="../../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
</head>
<body class="sociotype">

  <header class="topic-header">
    <div class="header-inner">
      <div class="header-nav">
        <a href="../../year-12.html" class="back-link">&larr; All Topics</a>
        <div class="header-actions">
          <a class="syllabus-chip-inline" href="https://curriculum.nsw.edu.au/learning-areas/mathematics/mathematics-standard-11-12-2024/content/year-12-tba2/fa6dd765ae" target="_blank" rel="noreferrer noopener">Syllabus &#8599;</a>
          <button id="darkModeToggle" class="dark-mode-btn" title="Toggle dark mode"><span class="toggle-icon">dark</span></button>
        </div>
      </div>
      <h1 class="topic-page-title"><em>Trigonometry</em></h1>
    </div>
  </header>

  <main class="main-content">
    <div class="pdf-viewer-container">
      <div class="lessons-sidebar" id="lessonsList"></div>
      <div class="pdf-viewer-main">
        <div class="pdf-controls">
          <div class="control-group" id="fileControls">
            <button class="pdf-btn" id="downloadBtn">&#8595; Download</button>
            <a class="pdf-btn" id="openExternalBtn" href="#" target="_blank" rel="noreferrer">&#8599; Open</a>
            <button class="pdf-btn" id="printSyllabusBtn">&#8942; Print Syllabus</button>
          </div>
          <div class="control-group" id="pageControls">
            <button class="pdf-nav-arrow" id="prevPage" disabled>&#8592;</button>
            <input class="page-info" id="pageInfo" type="text" inputmode="numeric" placeholder="–" disabled><span class="page-sep" id="pageTotal">/ –</span>
            <button class="pdf-nav-arrow" id="nextPage" disabled>&#8594;</button>
          </div>
          <div class="control-group" id="zoomControls">
            <div class="zoom-control">
              <button class="zoom-btn" id="zoomOut">&#8722;</button>
              <span class="zoom-display" id="zoomDisplay">–</span>
              <button class="zoom-btn" id="zoomIn">+</button>
            </div>
          </div>
        </div>
        <div class="pdf-stage" id="pdfStage">
          <div class="pdf-loading" id="pdfLoading">
            <div class="pdf-loading-spinner"></div>
            <p>Loading</p>
          </div>
          <div class="pdf-canvas-wrapper" id="pdfCanvasWrapper" style="display:none"></div>
          <iframe class="pdf-html-frame" id="pdfHtmlFrame" src="about:blank" title="Lesson"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script src="../../pdf-viewer.js"></script>
  <script>
    const toggle = document.getElementById('darkModeToggle');
    const toggleIcon = toggle.querySelector('.toggle-icon');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    if (isDark) { html.classList.add('dark-mode'); toggleIcon.textContent = 'light'; }
    else { html.classList.remove('dark-mode'); toggleIcon.textContent = 'dark'; }
    toggle.addEventListener('click', () => {
      const nowDark = html.classList.toggle('dark-mode');
      localStorage.setItem('theme', nowDark ? 'dark' : 'light');
      toggleIcon.textContent = nowDark ? 'light' : 'dark';
      const frame = document.getElementById('pdfHtmlFrame');
      try { if (frame && frame.contentDocument && frame.contentDocument.documentElement) { frame.contentDocument.documentElement.classList.toggle('dark-mode', nowDark); } } catch (e) {}
      try { if (frame && frame.contentWindow) { frame.contentWindow.postMessage({ type: 'ie-theme', dark: nowDark }, '*'); } } catch (e) {}
    });

    const TOPIC_ID = 'y12-4';

    const lessons = [
      {
        num: 1,
        title: "Right-Angled Trigonometry",
        slides: "lesson-01-right-angled.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Apply trigonometric ratios to right-angled triangles to find either the lengths of unknown sides or the size of unknown angles",
          "Work in both degrees, and degrees and minutes",
          "Identify and interpret angles of elevation and angles of depression and convert between them"
        ]
      },
      {
        num: 2,
        title: "The Sine & Cosine Rules",
        slides: "lesson-02-sine-cosine-rules.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Apply the sine rule a/sin A = b/sin B = c/sin C to find the value of an unknown side",
          "Apply the sine rule sin A/a = sin B/b = sin C/c to find the value of an unknown angle, excluding the ambiguous case",
          "Apply the sine rule to find an unknown angle, given that the unknown angle is obtuse",
          "Apply the cosine rule c^2 = a^2 + b^2 - 2ab cos C to find the value of an unknown side",
          "Apply the cosine rule cos C = (a^2 + b^2 - c^2)/(2ab) to find the value of an unknown angle"
        ]
      },
      {
        num: 3,
        title: "Area of a Triangle & Bearings",
        slides: "lesson-03-area-bearings.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Apply the formula A = (1/2)ab sin C, where a and b form the included angle C, to solve problems in a range of contexts",
          "Construct and interpret compass bearings and true bearings and solve related problems",
          "Solve practical problems involving the trigonometry of right-angled and non-right-angled triangles, angles of elevation and depression, and true and compass bearings"
        ]
      },
      {
        num: 4,
        homework: true,
        slides: "lesson-04-homework.html",
        annotated: null,
        kind: "html",
        syllabus: []
      },
      {
        num: 5,
        title: "Revision",
        revision: true,
        slides: "lesson-05-revision.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Review all Trigonometry dot-points",
          "Mixed exam-style practice with full worked solutions"
        ]
      }
    ];

    initPdfViewer({ topicId: TOPIC_ID, lessons });
  </script>
  <script src="../../question-popup.js"></script>
</body>
</html>
