  <script src="../../pdf-viewer.js"></script>
  <script>
    const toggle = document.getElementById('darkModeToggle');
    const toggleIcon = toggle.querySelector('.toggle-icon');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    if (isDark) { html.classList.add('dark-mode'); toggleIcon.textContent = 'light'; }
    else { html.classList.remove('dark-mode'); toggleIcon.textContent = 'dark'; }
    toggle.addEventListener('click', () => {
      const nowDark = html.classList.toggle('dark-mode');
      localStorage.setItem('theme', nowDark ? 'dark' : 'light');
      toggleIcon.textContent = nowDark ? 'light' : 'dark';
      const frame = document.getElementById('pdfHtmlFrame');
      try { if (frame && frame.contentDocument && frame.contentDocument.documentElement) { frame.contentDocument.documentElement.classList.toggle('dark-mode', nowDark); } } catch (e) {}
      try { if (frame && frame.contentWindow) { frame.contentWindow.postMessage({ type: 'ie-theme', dark: nowDark }, '*'); } } catch (e) {}
    });

    const TOPIC_ID = 'y12-10';

    const lessons = [
      {
        num: 1,
        title: "Normally Distributed Datasets",
        slides: "lesson-01-normal-datasets.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Recognise that a random variable that is normally distributed can be represented by a bell-shaped curve",
          "Explain that the mean, median and mode are approximately equal for data arising from a random variable that is normally distributed"
        ]
      },
      {
        num: 2,
        title: "Calculating z-scores",
        slides: "lesson-02-z-scores.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Describe the z-score as the number of standard deviations that a value is above or below the mean",
          "Recognise that the set of z-scores for data arising from a random variable that is normally distributed has a mean of 0 and standard deviation of 1",
          "Calculate the z-score corresponding to a specific value in a dataset by applying the formula z = (x - mean) / standard deviation",
          "Use z-scores to compare scores from different datasets and justify conclusions in the context of the problem"
        ]
      },
      {
        num: 3,
        title: "The Empirical Rule & Probability",
        slides: "lesson-03-empirical-rule.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Model and apply the empirical rule, where approximately 68% of data will have z-scores between -1 and 1, approximately 95% between -2 and 2, and approximately 99.7% between -3 and 3",
          "Calculate probabilities using z-scores and the empirical rule",
          "Represent probabilities by shading areas under the normal curve",
          "Use z-scores to identify probabilities of events less or more extreme than a given event and solve problems",
          "Use z-scores to make judgements related to outcomes of a given event or sets of data"
        ]
      },
      {
        num: 4,
        homework: true,
        slides: "lesson-04-homework.html",
        annotated: null,
        kind: "html",
        syllabus: []
      },
      {
        num: 5,
        title: "Revision",
        revision: true,
        slides: "lesson-05-revision.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Review all The Normal Distribution dot-points",
          "Mixed exam-style practice with full worked solutions"
        ]
      }
    ];

    initPdfViewer({ topicId: TOPIC_ID, lessons });
  </script>
  <script src="../../question-popup.js"></script>
