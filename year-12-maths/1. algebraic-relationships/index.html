<head>

</head>
<body class="sociotype">

  <header class="topic-header">
    <div class="header-inner">
      <div class="header-nav">
        <a href="../../year-12.html" class="back-link">&larr; All Topics</a>
        <div class="header-actions">
          <a class="syllabus-chip-inline" href="https://curriculum.nsw.edu.au/learning-areas/mathematics/mathematics-standard-11-12-2024/content/year-12-tba2/faf5e47f4a" target="_blank" rel="noreferrer noopener">Syllabus &#8599;</a>
          <button id="darkModeToggle" class="dark-mode-btn" title="Toggle dark mode"><span class="toggle-icon">dark</span></button>
        </div>
      </div>
      <h1 class="topic-page-title">Algebraic <em>Relationships</em></h1>
    </div>
  </header>

  <main class="main-content">
    <div class="pdf-viewer-container">
      <div class="lessons-sidebar" id="lessonsList"></div>
      <div class="pdf-viewer-main">
        <div class="pdf-controls">
          <div class="control-group" id="fileControls">
            <button class="pdf-btn" id="downloadBtn">&#8595; Download</button>
            <a class="pdf-btn" id="openExternalBtn" href="#" target="_blank" rel="noreferrer">&#8599; Open</a>
            <button class="pdf-btn" id="printSyllabusBtn">&#8942; Print Syllabus</button>
          </div>
          <div class="control-group" id="pageControls">
            <button class="pdf-nav-arrow" id="prevPage" disabled>&#8592;</button>
            <input class="page-info" id="pageInfo" type="text" inputmode="numeric" placeholder="–" disabled><span class="page-sep" id="pageTotal">/ –</span>
            <button class="pdf-nav-arrow" id="nextPage" disabled>&#8594;</button>
          </div>
          <div class="control-group" id="zoomControls">
            <div class="zoom-control">
              <button class="zoom-btn" id="zoomOut">&#8722;</button>
              <span class="zoom-display" id="zoomDisplay">–</span>
              <button class="zoom-btn" id="zoomIn">+</button>
            </div>
          </div>
        </div>
        <div class="pdf-stage" id="pdfStage">
          <div class="pdf-loading" id="pdfLoading">
            <div class="pdf-loading-spinner"></div>
            <p>Loading</p>
          </div>
          <div class="pdf-canvas-wrapper" id="pdfCanvasWrapper" style="display:none"></div>
          <iframe class="pdf-html-frame" id="pdfHtmlFrame" src="about:blank" title="Lesson"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script src="../../pdf-viewer.js"></script>
  <script>
    const toggle = document.getElementById('darkModeToggle');
    const toggleIcon = toggle.querySelector('.toggle-icon');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    if (isDark) { html.classList.add('dark-mode'); toggleIcon.textContent = 'light'; }
    else { html.classList.remove('dark-mode'); toggleIcon.textContent = 'dark'; }
    toggle.addEventListener('click', () => {
      const nowDark = html.classList.toggle('dark-mode');
      localStorage.setItem('theme', nowDark ? 'dark' : 'light');
      toggleIcon.textContent = nowDark ? 'light' : 'dark';
      const frame = document.getElementById('pdfHtmlFrame');
      try { if (frame && frame.contentDocument && frame.contentDocument.documentElement) { frame.contentDocument.documentElement.classList.toggle('dark-mode', nowDark); } } catch (e) {}
      try { if (frame && frame.contentWindow) { frame.contentWindow.postMessage({ type: 'ie-theme', dark: nowDark }, '*'); } } catch (e) {}
    });

    const TOPIC_ID = 'y12-1';

    const lessons = [
      {
        num: 1,
        title: "Simultaneous Equations & Break-Even",
        slides: "lesson-01-simultaneous-equations.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Graph two linear equations and identify the point of intersection, with and without graphing applications",
          "Solve a pair of simultaneous linear equations using graphical and algebraic methods",
          "Develop a pair of simultaneous linear equations to model a practical situation",
          "Solve practical problems that involve simultaneous linear equations",
          "Use break-even analysis to model and analyse situations where revenue and cost are represented by linear equations",
          "Identify the break-even point and solve problems involving profit and loss using a spreadsheet"
        ]
      },
      {
        num: 2,
        title: "Exponential Relationships",
        slides: "lesson-02-exponential-relationships.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Recognise exponential relationships represented by equations, tables, ordered pairs or graphs",
          "Graph exponential relationships y = a^x and y = a^(-x), where a > 0, with and without graphing applications",
          "Construct and analyse exponential models y = ka^x and y = ka^(-x) for growth or decay problems",
          "Interpret the parameters of exponential graphs in a variety of contexts",
          "Explain the limitations of exponential models in practical contexts"
        ]
      },
      {
        num: 3,
        title: "Quadratic & Reciprocal Relationships",
        slides: "lesson-03-quadratic-reciprocal.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Recognise quadratic relationships represented by equations, tables, ordered pairs or graphs",
          "Recognise parabolic shapes, identifying the axis of symmetry and vertex",
          "Graph quadratic relationships y = ax^2 + bx + c using graphing applications",
          "Identify the x-intercepts and the y-intercept from a graph",
          "Determine the axis of symmetry and vertex using the midpoint of the x-intercepts",
          "Recognise inverse variation as y = k/x, where k is the constant of variation",
          "Identify the hyperbolic shape of reciprocal graphs and solve problems graphically or algebraically",
          "Explain the limitations of these models and identify valid domain and range values"
        ]
      },
      {
        num: 4,
        homework: true,
        slides: "lesson-04-homework.html",
        annotated: null,
        kind: "html",
        syllabus: []
      },
      {
        num: 5,
        title: "Revision",
        revision: true,
        slides: "lesson-05-revision.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Review all Algebraic Relationships dot-points",
          "Mixed exam-style practice with full worked solutions"
        ]
      }
    ];

    initPdfViewer({ topicId: TOPIC_ID, lessons });
  </script>
  <script src="../../question-popup.js"></script>
</body>
</html>
