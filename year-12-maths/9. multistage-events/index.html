  <script src="../../pdf-viewer.js"></script>
  <script>
    const toggle = document.getElementById('darkModeToggle');
    const toggleIcon = toggle.querySelector('.toggle-icon');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved ? saved === 'dark' : prefersDark;
    if (isDark) { html.classList.add('dark-mode'); toggleIcon.textContent = 'light'; }
    else { html.classList.remove('dark-mode'); toggleIcon.textContent = 'dark'; }
    toggle.addEventListener('click', () => {
      const nowDark = html.classList.toggle('dark-mode');
      localStorage.setItem('theme', nowDark ? 'dark' : 'light');
      toggleIcon.textContent = nowDark ? 'light' : 'dark';
      const frame = document.getElementById('pdfHtmlFrame');
      try { if (frame && frame.contentDocument && frame.contentDocument.documentElement) { frame.contentDocument.documentElement.classList.toggle('dark-mode', nowDark); } } catch (e) {}
      try { if (frame && frame.contentWindow) { frame.contentWindow.postMessage({ type: 'ie-theme', dark: nowDark }, '*'); } } catch (e) {}
    });

    const TOPIC_ID = 'y12-9';

    const lessons = [
      {
        num: 1,
        title: "Sample Space, Probability & Complements",
        slides: "lesson-01-probability-basics.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Recognise that probabilities range from 0 (impossible) to 1 (certain) and can be represented as fractions, decimals and percentages",
          "Identify and define the sample space as the set of all possible outcomes of a chance experiment",
          "Determine the number of outcomes for an experiment",
          "Express the probability of an event that has a finite number of equally likely outcomes as P(event) = number of favourable outcomes / total number of outcomes",
          "Apply P(an event does not occur) = 1 \u2212 P(the event does occur) to calculate the probability of the complement of an event"
        ]
      },
      {
        num: 2,
        title: "Multistage Events, Trees & Arrays",
        slides: "lesson-02-multistage-trees.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Construct and use tree diagrams, arrays and tables to determine the outcomes and probabilities for multistage events",
          "Determine the probabilities of outcomes for multistage events using P(A and B) = P(A) \u00d7 P(B)",
          "Solve multistage problems involving selections made with and without replacement"
        ]
      },
      {
        num: 3,
        title: "Relative Frequency, Expected Frequency & Two-way Tables",
        slides: "lesson-03-relative-frequency.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Use relative frequency as an estimate of probability",
          "Recognise that increasing the number of trials produces relative frequencies that become closer in value to the theoretical probability",
          "Calculate the expected frequency of an event occurring using np, where n is the number of times an experiment is repeated and p is the probability that the event occurs each time",
          "Construct and interpret two-way tables and Venn diagrams from given information, limited to combinations of two attributes, and use them to solve problems in a variety of contexts",
          "Examine the use of statistics and the associated probabilities in shaping decisions made by the media, governments and companies"
        ]
      },
      {
        num: 4,
        homework: true,
        slides: "lesson-04-homework.html",
        annotated: null,
        kind: "html",
        syllabus: []
      },
      {
        num: 5,
        title: "Revision",
        revision: true,
        slides: "lesson-05-revision.html",
        annotated: null,
        kind: "html",
        syllabus: [
          "Review all Relative Frequency and Probability dot-points",
          "Mixed exam-style practice with full worked solutions"
        ]
      }
    ];

    initPdfViewer({ topicId: TOPIC_ID, lessons });
  </script>
