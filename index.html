<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathematics Standard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='22' fill='%23fff'>∞</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <script>
    // Jump straight to the remembered year unless the picker was asked for explicitly.
    (function () {
      if (location.search.indexOf('pick=1') !== -1) return;
      try {
        var y = localStorage.getItem('ie_year');
        if (y === '11') location.replace('year-11.html');
        else if (y === '12') location.replace('year-12.html');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <span class="nav-eyebrow">Mathematics Standard</span>
      <button id="darkModeToggle" class="dark-mode-btn" title="Toggle dark mode">
        <span class="toggle-icon">dark</span>
      </button>
    </div>
  </nav>

  <main class="year-picker">
    <div class="year-picker-head">
      <p class="year-picker-eyebrow">Choose your course</p>
      <h1 class="year-picker-title">Mathematics Standard</h1>
    </div>

    <div class="year-grid">

      <a class="year-card" href="year-11.html" data-year="11">
        <span class="year-card-num">11</span>
        <div class="year-card-body">
          <p class="year-card-eyebrow">Preliminary</p>
          <h2 class="year-card-title">Year 11</h2>
          <ul class="year-card-list">
            <li>9 topics</li>
            <li>PDF slides &amp; interactive lessons</li>
            <li>Past-paper library</li>
          </ul>
        </div>
        <span class="year-card-cta">Enter <span class="cta-arrow">&rarr;</span></span>
      </a>

      <a class="year-card" href="year-12.html" data-year="12">
        <span class="year-card-num">12</span>
        <div class="year-card-body">
          <p class="year-card-eyebrow">HSC &mdash; Standard 2</p>
          <h2 class="year-card-title">Year 12</h2>
          <ul class="year-card-list">
            <li>10 focus areas</li>
            <li>Fully interactive lessons</li>
            <li>Homework &amp; revision per topic</li>
          </ul>
        </div>
        <span class="year-card-cta">Enter <span class="cta-arrow">&rarr;</span></span>
      </a>

    </div>
  </main>

  <script>
    // ── Dark mode ───────────────────────────────────────────────
    function isNightByTime() {
      const h = new Date().getHours();
      return h < 6 || h >= 19;
    }
    const toggle = document.getElementById('darkModeToggle');
    const toggleIcon = document.querySelector('.toggle-icon');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    const isDark = savedTheme ? savedTheme === 'dark' : isNightByTime();
    if (isDark) { html.classList.add('dark-mode'); toggleIcon.textContent = 'light'; }
    else { html.classList.remove('dark-mode'); toggleIcon.textContent = 'dark'; }
    toggle.addEventListener('click', () => {
      const isDarkNow = html.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
      toggleIcon.textContent = isDarkNow ? 'light' : 'dark';
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'd' && !e.metaKey && !e.ctrlKey) {
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        toggle.click();
      }
    });

    // ── Remember the chosen year ────────────────────────────────
    document.querySelectorAll('.year-card').forEach(card => {
      card.addEventListener('click', () => {
        try { localStorage.setItem('ie_year', card.dataset.year); } catch (e) {}
      });
    });
  </script>
  <script src="question-popup.js"></script>
</body>
</html>
